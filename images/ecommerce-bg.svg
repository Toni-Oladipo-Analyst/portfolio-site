<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" />
      <stop offset="55%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0f2f3d" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- bar chart -->
  <g opacity="0.28" fill="#ffffff">
    <rect x="80" y="290" width="34" height="90" rx="4" />
    <rect x="126" y="250" width="34" height="130" rx="4" />
    <rect x="172" y="210" width="34" height="170" rx="4" />
    <rect x="218" y="150" width="34" height="230" rx="4" />
  </g>

  <!-- upward trend line -->
  <polyline points="70,340 200,270 320,300 450,190 620,130 730,80"
    fill="none" stroke="#4fd1c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <circle cx="730" cy="80" r="8" fill="#4fd1c5" opacity="0.9" />

  <!-- shopping cart -->
  <g transform="translate(560,260)" opacity="0.85" fill="none" stroke="#f4f5f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 h24 l22 90 h110 l24 -70 h-140" />
    <circle cx="60" cy="128" r="12" fill="#f4f5f7" stroke="none" />
    <circle cx="150" cy="128" r="12" fill="#f4f5f7" stroke="none" />
  </g>

  <!-- coins -->
  <g opacity="0.5">
    <circle cx="120" cy="120" r="22" fill="none" stroke="#4fd1c5" stroke-width="4" />
    <text x="120" y="128" font-size="20" fill="#4fd1c5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">$</text>
    <circle cx="165" cy="95" r="14" fill="none" stroke="#4fd1c5" stroke-width="3" />
  </g>

  <!-- scattered dots -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="700" cy="330" r="4" />
    <circle cx="670" cy="360" r="3" />
    <circle cx="40" cy="60" r="3" />
    <circle cx="90" cy="40" r="4" />
    <circle cx="380" cy="60" r="3" />
  </g>
</svg>
